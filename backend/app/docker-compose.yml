services:
  postgres:
    image: postgres:16-alpine
    container_name: duelrecord-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${DATASOURCE_USERNAME:?Set DATASOURCE_USERNAME in .env}
      POSTGRES_PASSWORD: ${DATASOURCE_PASSWORD:?Set DATASOURCE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?Set POSTGRES_PORT in .env}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: duelrecord_postgres_data
